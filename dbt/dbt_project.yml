
# Name your project! Project names should be lowercase and use underscores as separators
# See documentation: https://docs.getdbt.com/docs/build/projects

name: 'aura'
version: '1.0.0'
config-version: 2

profile: 'aura'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

# Event timestamps are naive UTC; this makes CURRENT_DATE / now() UTC too,
# whatever the host time zone (tests/timezone_utc.sql checks it).
on-run-start:
  - "SET GLOBAL TimeZone = 'UTC'"
clean-targets:
  - "target"
  - "dbt_modules"

models:
  aura:
    # Staging and intermediate go to the DuckLake "stage" (profiles.yml attach);
    # only marts are DuckDB tables in the work DB.
    staging:
      +tags: ["staging"]
      +database: stage
      materialized: view
    intermediate:
      +tags: ["intermediate"]
      +database: stage
      materialized: view
    marts:
      +tags: ["marts"]
      materialized: table
