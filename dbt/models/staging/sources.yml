version: 2

# Watcher -> dbt contract (spec §1.2, §2.1): Parquet files under
# $AURA_LAKE_DIR/<table>/date=YYYY-MM-DD/*.parquet. Delivery is at least once,
# so staging dedups on each table's key. Every staging read filters with the
# lake_cutoff() macro so one dbt cycle sees one consistent snapshot.
# external_location is passed through str.format_map by dbt-duckdb, so it must
# contain no curly braces after Jinja rendering.

sources:
  - name: lake
    tables:
      - name: raw_events
        description: >
          One row per parsed JSONL event, key (tenant_id, uuid). ts is the event
          time (naive UTC); ingested_at is the flush time; date is the hive
          partition (UTC date of ts).
        meta:
          external_location: "read_parquet('{{ env_var('AURA_LAKE_DIR', '/data/lake') }}/raw_events/*/*.parquet', hive_partitioning = true, union_by_name = true, filename = true, file_row_number = true)"
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 5, period: minute}
          error_after: {count: 30, period: minute}
        columns:
          - name: tenant_id
          - name: uuid
          - name: session_id
          - name: project_id
          - name: agent
          - name: event_type
          - name: ts
          - name: file_path
            description: Logical path (claude/<rel> or trace<N>/<rel>).
          - name: byte_offset
          - name: parent_uuid
          - name: request_id
          - name: message_id
          - name: is_sidechain
          - name: stop_reason
          - name: cwd
          - name: git_branch
          - name: claude_version
          - name: model
          - name: input_tokens
          - name: output_tokens
          - name: cache_creation_input_tokens
          - name: ephemeral_5m_input_tokens
          - name: ephemeral_1h_input_tokens
          - name: cache_read_input_tokens
          - name: context_pct
          - name: source
          - name: reported_cost_usd
          - name: payload
          - name: ingested_at

      - name: raw_session_skills
        description: Skill observations, key (tenant_id, session_id, skill_name).
        meta:
          external_location: "read_parquet('{{ env_var('AURA_LAKE_DIR', '/data/lake') }}/raw_session_skills/*/*.parquet', hive_partitioning = true, union_by_name = true)"
        columns:
          - name: tenant_id
          - name: session_id
          - name: skill_name
          - name: is_initial
          - name: observed_at
          - name: ingested_at

      - name: raw_session_mcps
        description: MCP server observations, key (tenant_id, session_id, mcp_server).
        meta:
          external_location: "read_parquet('{{ env_var('AURA_LAKE_DIR', '/data/lake') }}/raw_session_mcps/*/*.parquet', hive_partitioning = true, union_by_name = true)"
        columns:
          - name: tenant_id
          - name: session_id
          - name: mcp_server
          - name: first_seen_at
          - name: ingested_at

      - name: session_meta
        description: >
          Append-only session attribute observations; each row may set any
          subset of the columns. stg_session_meta collapses them per session.
        meta:
          external_location: "read_parquet('{{ env_var('AURA_LAKE_DIR', '/data/lake') }}/session_meta/*/*.parquet', hive_partitioning = true, union_by_name = true)"
        columns:
          - name: tenant_id
          - name: session_id
          - name: person_id
          - name: person_name
          - name: session_title
          - name: permission_mode
          - name: mode
          - name: observed_at
          - name: ingested_at

      - name: watcher_errors
        description: Watcher parse/ingest errors. Empty is the healthy state, so no freshness rule.
        meta:
          external_location: "read_parquet('{{ env_var('AURA_LAKE_DIR', '/data/lake') }}/watcher_errors/*/*.parquet', hive_partitioning = true, union_by_name = true)"
        columns:
          - name: ts
          - name: source
          - name: file_path
          - name: error_message
          - name: stack_trace
          - name: ingested_at
