services:
  watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    volumes:
      - ./data:/data
      - ${CLAUDE_LOGS_DIR:-~/.claude/projects}:/logs/claude:ro
    environment:
      # Never run this and start.ps1 / start.sh at the same time: both write the
      # same lake, state DB and work DB. The watcher refuses to start (exit 2)
      # while the other mode's watcher_status.json is < 120 s old.
      - AURA_RUN_MODE=compose
      - AURA_DATA_DIR=/data
      - AURA_DB_PATH=/data/work/aura.duckdb
      - AURA_LOGS_DIR=/logs/claude
      - AURA_VERDICTS_INBOX=/data/inbox/verdicts-inbox.jsonl
      # inotify events do not cross Docker Desktop bind mounts; poll instead.
      - AURA_OBSERVER=polling
      - AURA_POLL_SECONDS=30
      - AURA_DBT_RUN_INTERVAL_MINUTES=5
      - AURA_DBT_DIR=/app/dbt
      - AURA_DBT_THREADS=2
      - AURA_DBT_DUCKDB_THREADS=2
      # Keep ~1 GB below mem_limit so DuckDB spills instead of being OOM-killed.
      - AURA_DBT_MEMORY_LIMIT=4000MB
      - AURA_REDACT_PAYLOAD=true
      - AURA_HASH_CONTENT=${AURA_HASH_CONTENT:-}
      - AURA_MODEL_WINDOWS_JSON=
      # getpass.getuser() is 'root' inside the container; set the real person.
      - AURA_DEFAULT_PERSON_ID=${AURA_DEFAULT_PERSON_ID:-local}
      - AURA_DEFAULT_PERSON_NAME=${AURA_DEFAULT_PERSON_NAME:-Local User}
    healthcheck:
      # watcher_status.json is rewritten every flush tick (30 s), even when idle.
      test: ["CMD", "python", "-c", "import os,time,sys; p='/data/artifacts/watcher_status.json'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 5g
    # PID 1 init forwards signals and reaps the dbt child; without it a dbt
    # child dying mid-signal becomes a zombie and `docker compose stop` hangs.
    init: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data:ro
      # rw for the verdict inbox only; same path as in the watcher.
      - ./data/inbox:/data/inbox
    environment:
      - AURA_DATA_DIR=/data
      - AURA_VERDICTS_INBOX=/data/inbox/verdicts-inbox.jsonl
      - NODE_ENV=production
      - TZ=UTC
      # Bind all interfaces so the healthcheck can reach 127.0.0.1.
      - HOSTNAME=0.0.0.0
    depends_on:
      watcher:
        condition: service_healthy
    healthcheck:
      # node:20-slim has no wget/curl.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Above the 1 GB DuckDB cap (AURA_DUCKDB_MEMORY_LIMIT) so DuckDB spills first.
    mem_limit: 1536m
    restart: unless-stopped
