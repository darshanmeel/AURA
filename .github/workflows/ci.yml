name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watcher:
    name: watcher (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: watcher/pyproject.toml

      - name: Install watcher + test/lint tools
        run: python -m pip install -e ./watcher pytest ruff

      - name: Lint (ruff)
        run: python -m ruff check watcher/src

      - name: Test (pytest)
        run: python -m pytest watcher/tests -q

  pipeline:
    # Fixture transcripts -> watcher --once -> lake -> dbt -> published read DB
    # -> dbt test, frontend contract tests, number checks.
    name: pipeline (watcher + dbt + frontend on fixtures)
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: watcher/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # dbt-core / dbt-duckdb / duckdb pins come from watcher/pyproject.toml.
      - name: Install watcher (includes dbt)
        run: python -m pip install -e ./watcher

      - name: Install number-check deps
        working-directory: scripts/verify
        run: npm install --omit=dev

      # runner.temp is not available in job-level env, so paths go through GITHUB_ENV.
      # dbt needs all three path vars absolute and the inbox file present.
      - name: Set paths and seed the verdict inbox
        run: |
          D="$RUNNER_TEMP/aura"
          {
            echo "AURA_DATA_DIR=$D"
            echo "AURA_LOGS_DIR=$GITHUB_WORKSPACE/watcher/tests/fixtures/claude"
            echo "AURA_DB_PATH=$D/work/aura.duckdb"
            echo "AURA_LAKE_DIR=$D/lake"
            echo "AURA_READ_DIR=$D/read"
            echo "AURA_ARTIFACTS_DIR=$D/artifacts"
            echo "AURA_VERDICTS_INBOX=$D/inbox/verdicts-inbox.jsonl"
            echo "AURA_DBT_DIR=$GITHUB_WORKSPACE/dbt"
            echo "AURA_VERIFY_SCRIPT=$GITHUB_WORKSPACE/scripts/verify/run_all.mjs"
          } >> "$GITHUB_ENV"
          mkdir -p "$D/inbox"
          cp watcher/tests/fixtures/verdicts-inbox.jsonl "$D/inbox/verdicts-inbox.jsonl"

      - name: Watcher once + dbt cycle + publish
        run: python -m aura_watcher.main --once --with-dbt

      # The cycle already seeded and ran; test only.
      - name: dbt test
        working-directory: dbt
        run: dbt test --profiles-dir . --no-partial-parse

      # stg_session_verdicts is in the work DB only (not published).
      - name: Verdict inbox row count (work DB)
        run: |
          python -c "import duckdb,os; c=duckdb.connect(os.environ['AURA_DB_PATH'], read_only=True); n,m=c.execute('SELECT count(*), max(length(note)) FROM stg_session_verdicts').fetchone(); print(n,m); assert (n,m)==(1,500), (n,m)"

      - name: Frontend install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # Includes the read-DB contract test (EXPLAIN on every query).
      - name: Frontend tests
        working-directory: frontend
        env:
          AURA_TEST_READ_DIR: ${{ runner.temp }}/aura/read
        run: npm test

      - name: Number checks (read DB)
        run: node scripts/verify/run_all.mjs

      - name: start.sh syntax
        run: bash -n start.sh
