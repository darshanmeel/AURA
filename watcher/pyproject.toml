[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-watcher"
version = "0.1.0"
description = "Real-time JSONL watcher for Claude Code transcripts"
requires-python = ">=3.12"

# Pinned to the versions verified together in .dbtvenv (spec S16).
dependencies = [
    "watchdog>=6,<7",
    "duckdb==1.5.4",
    "dbt-core==1.11.11",
    "dbt-duckdb==1.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.package-data]
aura_watcher = ["read_tables.sql"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
# Conservative set: pyflakes (F) + pycodestyle (E, W) + isort (I).
select = ["E", "F", "W", "I"]
